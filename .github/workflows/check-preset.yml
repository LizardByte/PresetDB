---
name: Check preset request
permissions: {}

env:
  NODE_VERSION: '24'

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: |
      (
        github.event.action != 'labeled' ||
        github.event.label.name == 'request-game-preset' ||
        github.event.label.name == 'request-app-preset'
      ) && github.event.issue.state == 'open' && (
        contains(github.event.issue.labels.*.name, 'request-game-preset') ||
        contains(github.event.issue.labels.*.name, 'request-app-preset')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout database
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: database
          path: database-branch

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate request
        id: validate
        env:
          EVENT_FILE: ${{ github.event_path }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          node src/issue.js --event "$EVENT_FILE" --database database-branch/database \
            --mode check --report report.md --title-output issue-title.txt

      - name: Post result
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file report.md

      - name: Update issue title
        if: steps.validate.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs')
            const title = fs.readFileSync('issue-title.txt', 'utf8').trim()
            if (context.payload.issue.title !== title) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: context.issue.number,
                title
              })
            }

      - name: Queue trusted game submission
        if: steps.validate.outcome == 'success' && contains(github.event.issue.labels.*.name, 'request-game-preset')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GH_BOT_TOKEN }}
          script: |
            const {canApprove, queueIssueForApproval} = require('./src/approval-queue.js')
            if (canApprove(context.payload.issue.user.id)) {
              await queueIssueForApproval({github, context})
            }
