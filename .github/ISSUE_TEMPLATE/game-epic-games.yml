---
name: Epic Games game preset
description: Request an Epic Games launch option for a GameDB game.
title: '[EPIC GAMES GAME PRESET]: '
labels:
  - request-game-preset
  - method-epic-games
body:
  - type: markdown
    attributes:
      value: |
        One issue represents one Epic Games launch option. Provide the IGDB game URL;
        the bot resolves its ID and checks GameDB.
  - type: input
    id: game_url
    attributes:
      label: IGDB game URL
      description: Official URL containing the game slug, for example https://www.igdb.com/games/surviving-mars.
    validations:
      required: true
  - type: input
    id: launch_id
    attributes:
      label: Launch ID
      description: |
        Three-part Sandbox ID, Catalog ID, and Artifact ID from the Epic launcher shortcut,
        separated by colons or %3A. For example fn%3A4fe75bbc5a674f4f9b356b5c90567da5%3AFortnite.
        The bot generates the command for each supported launcher OS.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Setup instructions or prerequisites.
  - type: textarea
    id: replacement_reason
    attributes:
      label: Replacement reason
      description: Explain why the existing preset should change. Required with the issue number below.
  - type: input
    id: replacement_issue
    attributes:
      label: Preset to replace (issue number)
      description: Optional issue number shown with the published preset. Leave blank to add a new preset.
