---
name: Game launch preset
description: Request one Sunshine launch option for a GameDB game.
title: '[GAME PRESET]: '
labels:
  - request-game-preset
body:
  - type: markdown
    attributes:
      value: |
        One issue represents one launch option. Provide the IGDB game URL; the bot resolves its ID and checks GameDB.
        For Steam, Epic Games, or Microsoft Store, enter the matching launch ID; the bot creates the command.
        Add an emulator variant only when the operating system and launch method cannot distinguish the preset.
  - type: input
    id: game_url
    attributes:
      label: IGDB game URL
      description: Official URL containing the game slug, for example https://www.igdb.com/games/surviving-mars.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Host operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Launch method
      options:
        - Native
        - Steam
        - Epic Games
        - GOG
        - Microsoft Store
        - Emulator
    validations:
      required: true
  - type: input
    id: launch_id
    attributes:
      label: Launch ID
      description: |
        Required for Steam, Epic Games, and Microsoft Store; leave blank for Native, GOG, or Emulator.
        Steam: numeric app ID from a store URL, for example 464920.
        Epic Games: three-part ID between /apps/ and ? in a launcher shortcut,
        for example fn%3A4fe75bbc5a674f4f9b356b5c90567da5%3AFortnite.
        Microsoft Store: installed app's AUMID from Get-StartApps,
        for example Microsoft.WindowsCalculator_8wekyb3d8bbwe!App. A Store product ID will not launch it.
  - type: input
    id: variant_name
    attributes:
      label: Emulator variant name
      description: Optional emulator, console, or core label when needed to distinguish launch options.
  - type: input
    id: command
    attributes:
      label: Command
      description: |
        Required for Native, GOG, and Emulator. Leave blank for Steam, Epic Games, and Microsoft Store.
        Use {{ROM_PATH}} or {{HOME}} for variable paths. Windows also allows {{SYSTEM_DRIVE}},
        {{PROGRAM_FILES}}, and {{PROGRAM_FILES_X86}}. Literal home directories are rejected.
  - type: input
    id: working_dir
    attributes:
      label: Working directory
      description: Optional Sunshine working-dir value for Native, GOG, and Emulator only.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Setup instructions and required emulator settings.
  - type: textarea
    id: replacement_reason
    attributes:
      label: Replacement reason
      description: Explain why the existing preset should change. Required with the issue number below.
  - type: input
    id: replacement_issue
    attributes:
      label: Preset to replace (issue number)
      description: Optional issue number shown with the published preset. Leave blank to add a new preset.
